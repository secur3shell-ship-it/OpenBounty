# Runs every check on each push to master and on pull requests:
# - program: rustfmt, clippy, Rust unit tests, the committed IDL is current, and
#   the full integration suite on a local Surfpool network;
# - frontend: the generated client is current, typecheck, lint, unit tests, build.
#
# Tool versions match the ones the project is developed with (README "Run it
# yourself"). Downloaded binaries are checked against pinned SHA-256 sums.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: 4.1.2
  ANCHOR_VERSION: 1.2.0
  ANCHOR_SHA256: 0c9c41a3292c281cc6eadb78d6e1c8224d8324a34b0736a89d640fd314db05b7
  SURFPOOL_VERSION: v1.5.0
  SURFPOOL_SHA256: 5b20a3b46e60c4f819af7b4da5c3ea211f76041710617841cc23247d15887ddc
  NO_DNA: 1

jobs:
  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml (Rust 1.89.0 with rustfmt and clippy).
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Cache Solana CLI and platform tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor and Surfpool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          echo "${ANCHOR_SHA256}  $HOME/.local/bin/anchor" | sha256sum -c -
          chmod +x "$HOME/.local/bin/anchor"
          curl -sSfL -o /tmp/surfpool.tar.gz \
            "https://github.com/solana-foundation/surfpool/releases/download/${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz"
          echo "${SURFPOOL_SHA256}  /tmp/surfpool.tar.gz" | sha256sum -c -
          tar xzf /tmp/surfpool.tar.gz -C "$HOME/.local/bin" surfpool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: rustc --version && solana --version && anchor --version && surfpool --version

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install --frozen-lockfile

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p openbounty_v2 --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test -p openbounty_v2

      - name: Committed IDL matches the program
        run: |
          anchor build
          git diff --exit-code idl/ || { echo "::error::idl/ is out of date: run anchor build and commit idl/"; exit 1; }

      # The tests import target/types/, which anchor build generates.
      - name: Test typecheck
        run: yarn typecheck

      # The program keypair (target/deploy/*-keypair.json) is never committed, so
      # CI deploys the program under a throwaway ID: keys sync rewrites
      # declare_id!, Anchor.toml and the IDL in this checkout only. The deployer
      # is a throwaway key too.
      - name: Integration tests (Surfpool)
        run: |
          anchor keys sync
          solana-keygen new --no-bip39-passphrase --silent -o "$RUNNER_TEMP/deployer.json"
          OPENBOUNTY_WALLET="$RUNNER_TEMP/deployer.json" yarn test

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: offchain
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: offchain/package-lock.json

      - run: npm ci

      - name: Generated client matches the committed IDL
        run: |
          npm run generate:client
          git diff --exit-code src/generated || { echo "::error::src/generated is out of date: run npm run generate:client"; exit 1; }

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
